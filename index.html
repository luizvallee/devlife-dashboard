<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="VibeList — seu catálogo de músicas favoritas."
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <meta
      name="theme-color"
      content="#a855f7"
    />

    <!-- ÍCONE PARA DISPOSITIVOS APPLE -->
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
    />

    <!-- PRELOAD E PREFETCH DOS ÍCONES -->
    <link
      rel="preload"
      as="image"
      href="/icons/icon-192.png"
    />

    <link
      rel="prefetch"
      as="image"
      href="/icons/icon-512.png"
    />

    <!-- OTIMIZAÇÃO DO GOOGLE FONTS -->
    <link
      rel="dns-prefetch"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="https://fonts.gstatic.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- FONTE SORA -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>VibeList — Sua música, sua vibe</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
